  <div class="edge l"></div><div class="edge r"></div>

  <button class="cover-tap" id="openBtn" type="button" aria-label="Open the invitation">
    <span class="ring"><i></i></span>Tap to scroll
  </button>
</div>
<canvas id="petals" aria-hidden="true"></canvas>

<main class="card" id="card"></main>

<script>
/* =====================================================================
   2) RENDERER + EFFECTS.  You shouldn't need to edit below this line.
   ===================================================================== */
(function(){
const C = CONFIG, $ = s=>document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br  = s => esc(s).replace(/\n/g,'<br>');

/* theme + meta */
const r = document.documentElement.style, T=C.theme;
r.setProperty('--ground',T.ground);r.setProperty('--paper',T.paper);r.setProperty('--plum',T.plum);r.setProperty('--ink',T.ink);r.setProperty('--gold',T.gold);
if(T.fonts){r.setProperty('--f-script',T.fonts.script);r.setProperty('--f-serif',T.fonts.serif);r.setProperty('--f-caps',T.fonts.caps);r.setProperty('--f-deva',T.fonts.deva)}
if(C.images.paperTexture) r.setProperty('--tex',`url("${C.images.paperTexture}") repeat`);
document.title=C.pageTitle;
document.querySelector('meta[name=theme-color]').content=T.ground;
const md=document.createElement('meta');md.name='description';md.content=C.pageDescription;document.head.appendChild(md);

/* ---------- placeholder art (inline SVG line icons, 100x100 viewBox) ---------- */
const P='fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"';
const ICONS={
  ring:`<circle cx="38" cy="58" r="20"/><circle cx="62" cy="58" r="20"/><path d="M38 24l7-9h10l7 9-12 9z"/>`,
  plate:`<circle cx="50" cy="52" r="26"/><circle cx="50" cy="52" r="15"/><path d="M10 25v22M10 47v28M90 25c-6 6-6 20 0 26v24"/>`,
  music:`<path d="M38 74V26l40-8v48"/><path d="M38 40l40-8"/><ellipse cx="29" cy="74" rx="10" ry="8"/><ellipse cx="69" cy="66" rx="10" ry="8"/>`,
  drum:`<ellipse cx="50" cy="34" rx="30" ry="10"/><path d="M20 34v30c0 6 13 10 30 10s30-4 30-10V34"/><path d="M28 40l12 30M72 40L60 70M50 44v30"/><path d="M20 12l24 16M80 12L56 28"/>`,
  mandap:`<path d="M12 30h76L50 10z"/><path d="M22 30v58M78 30v58M36 30v58M64 30v58"/><path d="M12 88h76"/><path d="M50 66c-8-8 0-14 0-20 0 6 8 12 0 20z"/>`,
  glass:`<path d="M30 12h40c0 28-6 40-20 42C36 52 30 40 30 12z"/><path d="M50 54v30M34 88h32"/><path d="M32 28h36"/>`,
  kalash:`<path d="M36 28h28M32 36c-12 10-12 34 4 42h28c16-8 16-32 4-42z"/><path d="M40 78v10h20V78"/><path d="M50 28c-14-4-12-18 0-18s14 14 0 18z"/>`,
  flower:`<circle cx="50" cy="50" r="8"/><circle cx="50" cy="28" r="13"/><circle cx="50" cy="72" r="13"/><circle cx="28" cy="50" r="13"/><circle cx="72" cy="50" r="13"/>`,
  sun:`<circle cx="50" cy="50" r="18"/><path d="M50 10v14M50 76v14M10 50h14M76 50h14M22 22l10 10M68 68l10 10M78 22L68 32M32 68L22 78"/>`,
  shawl:`<path d="M16 30c20-16 48-16 68 0l-8 52H24z"/><path d="M30 36c12 8 28 8 40 0M24 82l6-30M76 82l-6-30M50 44v38"/>`,
  car:`<path d="M10 64V50l10-20h60l10 20v14z"/><circle cx="28" cy="68" r="9"/><circle cx="72" cy="68" r="9"/><path d="M22 50h56"/>`
};
const icon=(k,cls='')=>`<svg class="${cls}" viewBox="0 0 100 100" ${P} aria-hidden="true">${ICONS[k]||ICONS.flower}</svg>`;
const cornerSvg=`<svg viewBox="0 0 60 60" ${P.replace('stroke-width="4.5"','stroke-width="2.4"')} aria-hidden="true"><path d="M4 56V20C4 10 10 4 20 4h36"/><path d="M12 56V28c0-9 7-16 16-16h28"/><circle cx="20" cy="20" r="4"/><path d="M20 20c8 2 14 8 16 16M20 20c2 8 8 14 16 16"/></svg>`;
const dividerSvg=`<svg class="divider" viewBox="0 0 300 24" ${P.replace('stroke-width="4.5"','stroke-width="2.2"')} aria-hidden="true"><path d="M10 12h110M180 12h110"/><path d="M150 3l9 9-9 9-9-9z"/><circle cx="128" cy="12" r="2.5"/><circle cx="172" cy="12" r="2.5"/></svg>`;
const divider=()=> C.images.divider?`<img class="divider" src="${esc(C.images.divider)}" alt="">`:dividerSvg;
const corners=()=>['tl','tr','bl','br'].map(p=> C.images.cornerFlower
  ? `<img class="corner ${p}" src="${esc(C.images.cornerFlower)}" alt="">`
  : `<span class="corner ${p}">${cornerSvg}</span>`).join('');
const ganesha=()=> C.images.ganesha?`<img class="ganesha" src="${esc(C.images.ganesha)}" alt="Shri Ganesha">`:`<div class="ganesha-ph" aria-label="Shri Ganesha">ॐ</div>`;

/* ---------- build the page ---------- */
let h='';
h+=`<section id="intro">${corners()}${ganesha()}
  ${C.shlokaIntro?`<p class="deva">${br(C.shlokaIntro)}</p>`:''}
  <h1 class="script names">${esc(C.couple.first)}<span class="amp">&amp;</span>${esc(C.couple.second)}</h1>
  <p class="tagline">${esc(C.tagline)}</p>
  <div class="scratch" id="scratch"><b>${esc(C.date.display)}</b><span>${esc(C.date.weekday)}</span>
    <canvas id="scratchCanvas" tabindex="0" aria-label="Scratch to reveal the wedding date"></canvas></div>
  <p class="caps cd-label">${esc(C.date.countdownLabel)}</p>
  <div class="countdown" id="countdown">
    <div><b data-u="d">–</b><small>Days</small></div><div><b data-u="h">–</b><small>Hours</small></div>
    <div><b data-u="m">–</b><small>Minutes</small></div><div><b data-u="s">–</b><small>Seconds</small></div></div>
</section>`;

const F=C.family;
h+=`<section id="family">${ganesha().replace('class="ganesha"','class="ganesha" style="width:44px"').replace('class="ganesha-ph"','class="ganesha-ph" style="width:44px;height:44px;font-size:1.4rem"')}
  ${C.shlokaFamily?`<p class="deva">${br(C.shlokaFamily)}</p>`:''}
  <p class="lead">${esc(F.lead)}</p>
  <div class="person"><div class="script">${esc(F.bride.name)}</div><p>${esc(F.bride.parents)}</p></div>
  <p class="with">${esc(F.connector)}</p>
  <div class="person"><div class="script">${esc(F.groom.name)}</div><p>${esc(F.groom.parents)}</p></div>
  ${divider()}
  ${F.invited.map(g=>`<div class="invited"><h3>${esc(g.heading)}</h3>${g.lines.map(l=>`<p>${esc(l.text)}${l.sub?`<small>${esc(l.sub)}</small>`:''}</p>`).join('')}</div>`).join('')}
</section>`;

let n=0;
h+=`<section id="fest"><h2 class="script">${esc(C.festivitiesTitle)}</h2>
  ${C.days.map(d=>`<div class="banner">${esc(d.banner)}</div>${d.events.map(e=>{const rev=(n++)%2===1;
    const art=e.image?`<div class="art"><img src="${esc(e.image)}" alt="${esc(e.title)}"></div>`:`<div class="art">${icon(e.icon)}</div>`;
    return `<div class="event${rev?' rev':''}">${art}<div class="info"><h3>${esc(e.title)}</h3><div class="ev-div"></div>
      <p class="time">${esc(e.time)}</p>${e.note?`<p class="note">${esc(e.note)}</p>`:''}<p class="where">${esc(e.venue)}</p></div></div>`}).join('')}`).join('')}
  ${divider()}
</section>`;

if(C.poem.enabled) h+=`<section id="love"><h2 class="script" id="loveTitle" style="white-space:nowrap">${esc(C.poem.title)}</h2>
  ${C.poem.photo?`<figure class="photo-frame"><img class="photo" src="${esc(C.poem.photo)}" alt="${esc(C.couple.first)} and ${esc(C.couple.second)}"></figure>`:''}
  <div class="poem">${C.poem.stanzas.map(s=>`<p>${s.map(esc).join('<br>')}</p>`).join('')}</div>
  <div class="sign"><span class="caps">${esc(C.poem.signLabel)}</span><b>${esc(C.poem.signNames)}</b></div></section>`;

if(C.rsvp.enabled) h+=`<section id="rsvp"><h2 class="script">${esc(C.rsvp.title)}</h2><p>${esc(C.rsvp.text)}</p>
  <a class="btn gold" href="${esc(C.rsvp.url)}" target="_blank" rel="noopener">${esc(C.rsvp.buttonLabel)}</a></section>`;

if(C.venue.enabled){const emb=C.venue.mapEmbed,hasEmb=!!emb;
  h+=`<section id="venue"><h2 class="script">${esc(C.venue.title)}</h2>
  <div class="venue-row"><div class="map${hasEmb?' has-embed':''}">${emb?`<iframe src="${esc(emb)}" title="${esc(C.venue.name)} on Google Maps" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`:(C.venue.mapImage?`<img src="${esc(C.venue.mapImage)}" alt="Map">`:'')}
    ${hasEmb?'':`<span class="pin-pulse"></span><span class="pin-dot"></span>`}
    <a class="map-btn" href="${esc(C.venue.mapUrl)}" target="_blank" rel="noopener">${esc(C.venue.mapLabel)}</a></div>
    <div><p class="venue-name">${esc(C.venue.name)}</p><p class="venue-place">${esc(C.venue.place)}</p></div></div>
  ${divider()}</section>`;}

if(C.firms&&C.firms.enabled) h+=`<section id="firms"><h2 class="script">${esc(C.firms.title)}</h2><div class="firms">
  <h3>${esc(C.firms.groomHeading)}</h3>${C.firms.groomLines.map(l=>`<p>${esc(l)}</p>`).join('')}
  <p class="contact">${esc(C.firms.groomContact)}</p>
  <h3>${esc(C.firms.brideHeading)}</h3>${C.firms.brideLines.map(l=>`<p>${esc(l)}</p>`).join('')}
  <p class="contact">${esc(C.firms.brideContact)}</p></div>${divider()}</section>`;

if(C.tips.enabled) h+=`<section id="things"><h2 class="script">${esc(C.tips.title)}</h2><div class="tips">
  ${C.tips.items.map(t=>`<div class="tip">${icon(t.icon,'tip-ic')}<h3>${esc(t.title)}</h3><p>${esc(t.text)}</p>
    ${t.chips?`<div class="temps">${t.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}</div>`).join('')}</div></section>`;

h+=`<footer>${esc(C.footer)}</footer>`;
$('#card').innerHTML=h;

/* ---------- music ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, body=document.body, cover=$('#cover');
const music=$('#music'), mt=$('#musicToggle');
if(C.music&&C.music.src){music.src=C.music.src;mt.hidden=false}
function sync(){const p=!music.paused&&!music.ended;mt.setAttribute('aria-pressed',String(p));mt.setAttribute('aria-label',p?'Pause background music':'Play background music')}
const playMusic=()=>{if(C.music&&C.music.src) music.play().catch(sync)};
['play','pause','error'].forEach(e=>music.addEventListener(e,sync));
mt.addEventListener('click',()=>music.paused?playMusic():music.pause());

/* ---------- petals ---------- */
const cv=$('#petals'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=Math.min(2,devicePixelRatio||1),petals=[],ambient=false,running=false;
const COLORS=[['#b8e0d8','#1a7a72'],['#f0c4b8','#c45c6a'],['#d4ebe4','#0f6b6d'],['#e8c8bc','#a85a48']];
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
function mk(b){const s=7+Math.random()*9;return{x:b?W/2+(Math.random()-.5)*W*.5:Math.random()*W,y:b?H*.35+(Math.random()-.5)*H*.3:-20-Math.random()*H*.3,
  vx:b?(Math.random()-.5)*5:(Math.random()-.5)*.6,vy:b?-1-Math.random()*3:.6+Math.random()*.9,s,r:Math.random()*6.28,vr:(Math.random()-.5)*.06,
  flip:Math.random()*6.28,vf:.03+Math.random()*.05,sway:Math.random()*6.28,c:COLORS[(Math.random()*COLORS.length)|0]}}
function drawPetal(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(1,Math.abs(Math.cos(p.flip))*.8+.2);
  const g=ctx.createLinearGradient(0,-p.s,0,p.s);g.addColorStop(0,p.c[0]);g.addColorStop(1,p.c[1]);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-p.s);
  ctx.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.7,p.s*.7,0,p.s);ctx.bezierCurveTo(-p.s*.7,p.s*.7,-p.s*.9,-p.s*.6,0,-p.s);ctx.fill();ctx.restore()}
function tick(){ctx.clearRect(0,0,W,H);if(ambient&&petals.length<22&&Math.random()<.06)petals.push(mk(false));
  for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.vy=Math.min(p.vy+.035,1.6);p.vx*=.985;p.sway+=.02;p.x+=p.vx+Math.sin(p.sway)*.7;p.y+=p.vy;p.r+=p.vr;p.flip+=p.vf;
    if(p.y>H+30||p.x<-40||p.x>W+40){petals.splice(i,1);continue}drawPetal(p)}
  if(petals.length||ambient)requestAnimationFrame(tick);else running=false}
function kick(){if(!running){running=true;requestAnimationFrame(tick)}}
function startPetals(){if(reduce)return;for(let i=0;i<70;i++)petals.push(mk(true));for(let i=0;i<40;i++)petals.push(mk(false));ambient=true;kick();setTimeout(()=>ambient=false,14000)}

/* ---------- cover: scroll unrolls ---------- */
const bg=$('#coverBg'),rodT=cover.querySelector('.rod.top'),rodB=cover.querySelector('.rod.bot'),eL=cover.querySelector('.edge.l'),eR=cover.querySelector('.edge.r');
const ROD_RATIO=.075, PAPER=.46;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,seg=(t,a,b)=>clamp((t-a)/(b-a));
let t0=null,opened=false,done=false;
function frame(now){if(done)return;
  const w=cover.clientWidth,hh=cover.clientHeight,cx=w/2,time=now/1000,t=t0==null?-1:(now-t0)/1000;
  const w0=Math.min(w*.86,430),w1=Math.max(w*1.45,w0),bob=t<0?Math.sin(time*1.8)*5:0,p=t<0?0:ease(seg(t,.1,3));
  const rw=lerp(w0,w1,ease(seg(t,.1,2.4))),rh=rw*ROD_RATIO,cy=lerp(hh*.42,hh*.5,p)+bob,gap=lerp(0,hh+rh*2.4,p),ov=rh*.28,left=cx-rw/2;
  rodT.style.width=rodB.style.width=rw+'px';rodT.style.height=rodB.style.height=rh+'px';
  rodT.style.transform=`translate(${left}px,${cy-gap/2-rh+ov}px)`;rodB.style.transform=`translate(${left}px,${cy+gap/2-ov}px)`;
  const x0=cx-PAPER*rw,x1=cx+PAPER*rw,y0=cy-gap/2,y1=cy+gap/2;
  bg.style.clipPath=gap>.5?`polygon(evenodd,0 0,${w}px 0,${w}px ${hh}px,0 ${hh}px,0 0,${x0}px ${y0}px,${x1}px ${y0}px,${x1}px ${y1}px,${x0}px ${y1}px,${x0}px ${y0}px)`:'none';
  eL.style.height=eR.style.height=gap+'px';eL.style.transform=`translate(${x0}px,${y0}px)`;eR.style.transform=`translate(${x1-10}px,${y0}px)`;
  if(t>3.15){done=true;cover.classList.add('gone');body.classList.remove('locked');return}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function openCover(){if(opened)return;opened=true;playMusic();
  if(reduce){done=true;cover.classList.add('gone');body.classList.remove('locked');body.classList.add('opened');return}
  t0=performance.now();cover.classList.add('meet');body.classList.add('opened');setTimeout(startPetals,1300)}
$('#openBtn').addEventListener('click',e=>{e.stopPropagation();openCover()});cover.addEventListener('click',openCover);

/* ---------- scratch card (gold foil drawn in canvas, no image needed) ---------- */
const sc=$('#scratchCanvas'),sx=sc.getContext('2d');let scratched=false,drawing=false,last=null,ct=0;
function paintFoil(){const b=sc.getBoundingClientRect();if(!b.width)return;sc.width=b.width*dpr;sc.height=b.height*dpr;
  const g=sx.createLinearGradient(0,0,sc.width,sc.height);g.addColorStop(0,'#d9b96a');g.addColorStop(.5,'#b8923a');g.addColorStop(1,'#e6cf8f');
  sx.globalCompositeOperation='source-over';sx.fillStyle=g;sx.fillRect(0,0,sc.width,sc.height);
  sx.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<260;i++)sx.fillRect(Math.random()*sc.width,Math.random()*sc.height,2*dpr,2*dpr);
  sx.fillStyle='#fff8e1';sx.textAlign='center';sx.textBaseline='middle';sx.font=`${13*dpr}px Josefin Sans, sans-serif`;
  sx.fillText('SCRATCH TO REVEAL THE DATE',sc.width/2,sc.height/2)}
paintFoil();document.fonts&&document.fonts.ready.then(()=>{if(!scratched)paintFoil()});addEventListener('resize',()=>{if(!scratched)paintFoil()});
const pos=e=>{const b=sc.getBoundingClientRect();return{x:(e.clientX-b.left)*dpr,y:(e.clientY-b.top)*dpr}};
function scratchAt(p){sx.globalCompositeOperation='destination-out';sx.lineCap=sx.lineJoin='round';sx.lineWidth=28*dpr;sx.beginPath();sx.moveTo((last||p).x,(last||p).y);sx.lineTo(p.x,p.y);sx.stroke();last=p}
function check(){const d=sx.getImageData(0,0,sc.width,sc.height).data;let clear=0,k=0;for(let i=3;i<d.length;i+=64){k++;if(d[i]<20)clear++}if(clear/k>.45)reveal()}
function reveal(){if(scratched)return;scratched=true;sc.classList.add('done');
  if(!reduce){const b=sc.getBoundingClientRect();for(let i=0;i<36;i++){const p=mk(true);p.x=b.left+b.width/2+(Math.random()-.5)*b.width;p.y=b.top+b.height/2;p.vy=-2-Math.random()*4;petals.push(p)}kick()}}
sc.addEventListener('pointerdown',e=>{drawing=true;last=null;sc.setPointerCapture(e.pointerId);scratchAt(pos(e))});
sc.addEventListener('pointermove',e=>{if(!drawing)return;scratchAt(pos(e));if(++ct%6===0)check()});
const end=()=>{if(drawing){drawing=false;last=null;check()}};sc.addEventListener('pointerup',end);sc.addEventListener('pointercancel',end);
sc.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')reveal()});

/* ---------- fit one-line text (poem, love title) ---------- */
function fit(){
  const poem=$('.poem');if(poem){poem.style.fontSize='';const base=parseFloat(getComputedStyle(poem).fontSize),av=poem.clientWidth;let wide=0;
    poem.querySelectorAll('p').forEach(p=>{const rg=document.createRange();rg.selectNodeContents(p);[...rg.getClientRects()].forEach(c=>wide=Math.max(wide,c.width))});
    if(wide>av)poem.style.fontSize=(base*av/wide*.97)+'px'}
  const lt=$('#loveTitle');if(lt){lt.style.fontSize='';const av=lt.clientWidth,need=lt.scrollWidth;if(need>av)lt.style.fontSize=(parseFloat(getComputedStyle(lt).fontSize)*av/need*.98)+'px'}}
fit();document.fonts&&document.fonts.ready.then(fit);addEventListener('resize',fit);

/* ---------- countdown ---------- */
const target=new Date(C.date.countdownTo).getTime(),els={};document.querySelectorAll('#countdown b').forEach(b=>els[b.dataset.u]=b);
function cd(){let t=Math.max(0,target-Date.now());const d=Math.floor(t/864e5);t-=d*864e5;const hh=Math.floor(t/36e5);t-=hh*36e5;const m=Math.floor(t/6e4);t-=m*6e4;const s=Math.floor(t/1e3);
  els.d.textContent=d;els.h.textContent=String(hh).padStart(2,'0');els.m.textContent=String(m).padStart(2,'0');els.s.textContent=String(s).padStart(2,'0')}
cd();setInterval(cd,1000);
})();
</script>
</body>
</html>
